---
# Valida somente a role herdr em um HOME descartável dentro de tasks/herdr-install.
# Nunca aponta para o HOME real, ~/.local/bin real, settings do CAO ou systemd.
- name: Validar apenas herdr em HOME isolado
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  vars:
    ai_stack_user: "{{ ansible_facts['user_id'] }}"
    ai_stack_home: "{{ playbook_dir }}/ansible-home"
    ai_stack_bin_dir: "{{ ai_stack_home }}/.local/bin"
    ai_stack_cache_dir: "{{ ai_stack_home }}/.cache/ai-stack"
    ai_stack_upgrade: false
    ai_stack_environment:
      HOME: "{{ ai_stack_home }}"
      PATH: "{{ ai_stack_bin_dir }}:/usr/local/bin:/usr/bin:/bin"
      XDG_CONFIG_HOME: "{{ ai_stack_home }}/.config"
      XDG_DATA_HOME: "{{ ai_stack_home }}/.local/share"
      XDG_CACHE_HOME: "{{ ai_stack_home }}/.cache"
  pre_tasks:
    - name: Impedir aplicação acidental no HOME real
      ansible.builtin.assert:
        that:
          - ai_stack_home == playbook_dir ~ '/ansible-home'
          - ai_stack_home != ansible_facts['env']['HOME']
          - not ai_stack_bin_dir.startswith(ansible_facts['env']['HOME'] ~ '/.local')
  roles:
    - role: ../../ai/roles/herdr
      tags: [herdr]
