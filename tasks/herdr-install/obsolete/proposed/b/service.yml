---
- name: Verificar condições para migração de unidade CAO
  ansible.builtin.import_tasks: service-preflight.yml

- name: Validar backend de terminal do CAO
  ansible.builtin.assert:
    that: cao_terminal_backend in ['tmux', 'herdr']
    fail_msg: "cao_terminal_backend deve ser tmux ou herdr (experimental), não '{{ cao_terminal_backend }}'."

- name: Verificar comando herdr para o backend herdr
  ansible.builtin.stat:
    path: "{{ ai_stack_bin_dir }}/herdr"
  register: cao_herdr_command
  when: cao_service_enabled | bool and cao_terminal_backend == 'herdr'

# Em check mode o herdr ainda não foi instalado; basta estar habilitado na stack.
- name: Exigir herdr instalado, ou habilitado no check mode, para o backend herdr
  ansible.builtin.assert:
    that: >-
      (cao_herdr_command.stat.executable | default(false)) or
      (ansible_check_mode and herdr_enabled | default(true) | bool)
    fail_msg: >-
      cao_terminal_backend=herdr exige {{ ai_stack_bin_dir }}/herdr. Execute
      ai/herdr.yml (herdr_enabled=true) antes, ou use cao_terminal_backend=tmux.
  when: cao_service_enabled | bool and cao_terminal_backend == 'herdr'


- name: Configurar serviço opcional do CAO
  become: true
  become_user: root
  when: cao_service_enabled | bool
  block:
    - name: Informar migração prevista em modo de verificação
      ansible.builtin.debug:
        msg: "Seria parada e desabilitada a unidade legada {{ item.item }}, removido seu arquivo e recarregado o systemd."
      loop: "{{ cao_legacy_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: ansible_check_mode and item.stat.exists
      changed_when: true

    - name: Parar e desabilitar unidades legadas
      ansible.builtin.systemd_service:
        name: "{{ item.item }}.service"
        enabled: false
        state: stopped
      loop: "{{ cao_legacy_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists and not ansible_check_mode

    - name: Remover arquivos das unidades legadas
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item.item }}.service"
        state: absent
      loop: "{{ cao_legacy_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists
      register: cao_legacy_removed

    - name: Recarregar systemd após remoção das unidades legadas
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: cao_legacy_removed.changed and not ansible_check_mode

    # Em ai/all.yml, ai/herdr.yml já rodou; no check mode o herdr ainda não existe.
    - name: Exigir comando herdr instalado antes de gravar a unidade
      ansible.builtin.stat:
        path: "{{ ai_stack_bin_dir }}/herdr"
      register: cao_herdr_installed
      when: cao_terminal_backend == 'herdr'

    - name: Recusar unidade herdr sem o comando herdr
      ansible.builtin.assert:
        that: ansible_check_mode or (cao_herdr_installed.stat.executable | default(false))
        fail_msg: >-
          cao_terminal_backend=herdr exige {{ ai_stack_bin_dir }}/herdr. Execute
          ai/herdr.yml antes, ou use cao_terminal_backend=tmux.
      when: cao_terminal_backend == 'herdr'

    - name: Instalar unidade systemd do CAO
      ansible.builtin.template:
        src: cao-server.service.j2
        dest: "/etc/systemd/system/{{ cao_service_name }}.service"
        owner: root
        group: root
        mode: '0644'
      notify: Reiniciar servidor CAO

    - name: Habilitar e iniciar servidor CAO
      ansible.builtin.systemd_service:
        name: "{{ cao_service_name }}"
        daemon_reload: true
        enabled: true
        state: started
      when: not ansible_check_mode
