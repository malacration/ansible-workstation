---
- name: Preparar dependências comuns
  ansible.builtin.import_playbook: common.yml

- name: Garantir Codex para registrar o MCP
  ansible.builtin.import_playbook: codex.yml
  when: "'codex' in (chrome_devtools_clients | default(['codex', 'claude_code']))"

- name: Garantir Claude Code para registrar o MCP
  ansible.builtin.import_playbook: claude.yml
  when: "'claude_code' in (chrome_devtools_clients | default(['codex', 'claude_code']))"

- name: Preparar Node.js para Chrome DevTools MCP
  ansible.builtin.import_playbook: node.yml

- name: Preparar navegador Chrome
  ansible.builtin.import_playbook: ../browser/chrome.yml
  when:
    - chrome_devtools_install_browser | default(true) | bool
    - ansible_facts['architecture'] == 'x86_64'

- name: Instalar e registrar Chrome DevTools MCP
  hosts: localhost
  connection: local
  become: false
  gather_facts: true
  roles:
    - chrome_devtools
