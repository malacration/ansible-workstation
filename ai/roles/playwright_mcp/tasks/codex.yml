---
- name: Consultar registro atual do Playwright no Codex
  ansible.builtin.command:
    argv: ["{{ ai_stack_bin_dir }}/codex", mcp, get, playwright, --json]
  register: playwright_mcp_codex_current
  changed_when: false
  failed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Adicionar ou atualizar MCP global no Codex
  ansible.builtin.command:
    argv: >-
      {{ [ai_stack_bin_dir ~ '/codex', 'mcp', 'add', 'playwright', '--', playwright_mcp_command]
         + playwright_mcp_args }}
  changed_when: true
  when:
    - not ansible_check_mode
    - >-
      playwright_mcp_codex_current.rc != 0 or
      (playwright_mcp_codex_current.stdout | from_json).transport.command | default('') != playwright_mcp_command or
      (playwright_mcp_codex_current.stdout | from_json).transport.args | default([], true) != playwright_mcp_args or
      not (playwright_mcp_codex_current.stdout | from_json).enabled
