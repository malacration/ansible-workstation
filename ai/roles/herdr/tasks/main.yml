---
- name: Validar parâmetros do herdr
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == 'Linux'
      - herdr_version == 'latest' or herdr_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
      - ai_stack_home.startswith('/') and ai_stack_home != '/'
      - herdr_install_dir.startswith(ai_stack_home ~ '/')
      - herdr_binary.startswith(ai_stack_home ~ '/')
      - herdr_checksum == '' or herdr_checksum is match('^sha256:[a-fA-F0-9]{64}$')

# Upstream publica binários Linux somente para x86_64 e aarch64 (herdr-linux-ARCH).
- name: Informar arquitetura sem binário oficial do herdr
  ansible.builtin.debug:
    msg: >-
      herdr omitido: não há release Linux oficial para
      {{ ansible_facts['architecture'] }} (suportadas: x86_64, aarch64).
  when: ansible_facts['architecture'] not in ['x86_64', 'aarch64']

- name: Gerenciar herdr como usuário dos agentes
  ansible.builtin.include_tasks: install.yml
  when: ansible_facts['architecture'] in ['x86_64', 'aarch64']
