---
# Trust path: GitHub release metadata (herdrdev/herdr) + official SHA256 manifest
# (herdr.dev/latest.json, generated by upstream release.yml) + optional audited
# and operator pins. All present sources must agree before anything executes.
- name: Consultar metadados oficiais do release solicitado
  ansible.builtin.uri:
    url: "{{ herdr_release_api }}/{{ 'latest' if herdr_version == 'latest' else 'tags/v' ~ herdr_version }}"
    return_content: true
  register: herdr_release

- name: Validar release estável e binário Linux da arquitetura
  ansible.builtin.assert:
    that:
      - herdr_release.json.tag_name is match('^v[0-9]+[.][0-9]+[.][0-9]+$')
      - not herdr_release.json.draft
      - not herdr_release.json.prerelease
      - herdr_version == 'latest' or herdr_release.json.tag_name == 'v' ~ herdr_version
      - herdr_release.json.assets | selectattr('name', 'equalto', herdr_asset_name) | list | length == 1
    fail_msg: Release herdr inexistente, instável ou sem binário {{ herdr_asset_name }}.

- name: Definir versão e metadados resolvidos
  ansible.builtin.set_fact:
    herdr_resolved_version: "{{ herdr_release.json.tag_name[1:] }}"
    herdr_asset: "{{ herdr_release.json.assets | selectattr('name', 'equalto', herdr_asset_name) | first }}"

- name: Baixar manifesto oficial de checksums
  ansible.builtin.uri:
    url: "{{ herdr_manifest_url }}"
    return_content: true
  register: herdr_manifest

# The manifest keeps a per-version history (releases.<version>.sha256.<target>),
# so pinned older releases stay verifiable after newer ones are published.
- name: Localizar checksum oficial exato do binário
  ansible.builtin.set_fact:
    herdr_official_sha256: >-
      {{ (((herdr_manifest.content | from_json).releases | default({})).get(herdr_resolved_version, {}).sha256
          | default({})).get('linux-' ~ ansible_facts['architecture'], '') | string | lower }}

- name: Exigir checksum oficial e validar digest e pins disponíveis
  ansible.builtin.assert:
    that:
      - herdr_official_sha256 is match('^[a-f0-9]{64}$')
      - herdr_checksum == '' or herdr_checksum | lower == 'sha256:' ~ herdr_official_sha256
      - >-
        herdr_audited_checksums.get(herdr_resolved_version, {}).get(ansible_facts['architecture'], herdr_official_sha256)
        | lower == herdr_official_sha256
      - herdr_asset.digest | default('sha256:' ~ herdr_official_sha256, true) | lower == 'sha256:' ~ herdr_official_sha256
    fail_msg: Manifesto/digest/pin herdr divergente ou checksum ausente; instalação interrompida.

- name: Baixar binário oficial conferindo SHA256 antes de executar
  ansible.builtin.get_url:
    url: "{{ herdr_release_download_url }}/v{{ herdr_resolved_version }}/{{ herdr_asset_name }}"
    dest: "{{ ai_stack_cache_dir }}/herdr/{{ herdr_resolved_version }}-{{ herdr_asset_name }}"
    checksum: "sha256:{{ herdr_official_sha256 }}"
    mode: '0600'
  register: herdr_download

- name: Validar candidato antes de substituir o binário
  block:
    - name: Criar diretório temporário do candidato
      ansible.builtin.tempfile:
        state: directory
        path: "{{ ai_stack_cache_dir }}/herdr"
        prefix: candidate-
      register: herdr_candidate

    - name: Copiar binário verificado para o candidato executável
      ansible.builtin.copy:
        src: "{{ herdr_download.dest }}"
        dest: "{{ herdr_candidate.path }}/herdr"
        remote_src: true
        mode: '0755'

    - name: Calcular SHA256 do candidato sem seguir links
      ansible.builtin.stat:
        path: "{{ herdr_candidate.path }}/herdr"
        checksum_algorithm: sha256
        follow: false
        get_mime: false
      register: herdr_candidate_stat

    - name: Exigir candidato regular, executável e íntegro
      ansible.builtin.assert:
        that:
          - herdr_candidate_stat.stat.isreg | default(false)
          - not herdr_candidate_stat.stat.islnk | default(false)
          - herdr_candidate_stat.stat.executable | default(false)
          - herdr_candidate_stat.stat.checksum == herdr_official_sha256

    - name: Conferir versão declarada pelo executável
      ansible.builtin.command:
        argv: ["{{ herdr_candidate.path }}/herdr", --version]
      changed_when: false
      register: herdr_candidate_version
      failed_when: herdr_candidate_version.stdout | trim != 'herdr ' ~ herdr_resolved_version

    - name: Preservar destinos instalados inválidos antes da publicação
      ansible.builtin.script:
        cmd: >-
          {{ (role_path ~ '/files/installed_state.py') | quote }}
          --install-dir {{ herdr_install_dir | quote }}
          --architecture {{ ansible_facts['architecture'] | quote }}
          --prepare-publication
        executable: python3
      register: herdr_invalid_paths
      changed_when: (herdr_invalid_paths.stdout | from_json).changed

    - name: Publicar binário validado atomicamente
      ansible.builtin.copy:
        src: "{{ herdr_candidate.path }}/herdr"
        dest: "{{ herdr_install_dir }}/bin/herdr"
        remote_src: true
        mode: '0755'
        backup: true

    - name: Registrar proveniência e integridade do release
      ansible.builtin.copy:
        content: >-
          {{ {'version': herdr_resolved_version, 'asset': herdr_asset_name,
              'sha256': herdr_official_sha256,
              'source': herdr_release_download_url ~ '/v' ~ herdr_resolved_version,
              'manifest': herdr_manifest_url} | to_nice_json }}
        dest: "{{ herdr_install_dir }}/release.json"
        mode: '0600'
        backup: true
  always:
    - name: Remover somente diretório temporário do candidato
      ansible.builtin.file:
        path: "{{ herdr_candidate.path }}"
        state: absent
      when: herdr_candidate.path is defined

# Only reached after a successful publication. Prune downloads of other
# versions: exact cache naming, regular files only, links are never followed.
- name: Localizar downloads de outras versões no cache
  ansible.builtin.find:
    paths: "{{ ai_stack_cache_dir }}/herdr"
    patterns: '^[0-9]+[.][0-9]+[.][0-9]+-herdr-linux-(x86_64|aarch64)$'
    use_regex: true
    file_type: file
    follow: false
    recurse: false
    hidden: false
  register: herdr_cached_downloads

- name: Remover downloads de outras versões do cache
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ herdr_cached_downloads.files | rejectattr('path', 'equalto', herdr_download.dest) | list }}"
  loop_control:
    label: "{{ item.path | basename }}"
